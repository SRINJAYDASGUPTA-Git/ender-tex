  /projects/{projectId}/folders/{folderPath}:
    delete:
      description: Deletes an empty directory from the project.
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: Project-relative directory path
        in: path
        name: folderPath
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Invalid directory path
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Directory not found
          schema:
            type: string
        "409":
          description: Directory is not empty
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Delete directory
      tags:
      - Folders
    patch:
      consumes:
      - application/json
      description: Renames a project directory.
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: Project-relative directory path
        in: path
        name: folderPath
        required: true
        type: string
      - description: New directory path
        in: body
        name: request
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid request or directory path
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Directory not found
          schema:
            type: string
        "409":
          description: Destination already exists
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Rename directory
      tags:
      - Folders
    post:
      consumes:
      - application/json
      description: Creates a new directory within the project.
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: Project-relative directory path
        in: path
        name: folderPath
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid directory path
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Directory already exists
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Create directory
      tags:
      - Folders
  /projects/{projectId}/pdf:
    get:
      description: Returns the most recently compiled PDF for the project.
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Invalid project path
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: PDF not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get compiled PDF
      tags:
      - Compilation

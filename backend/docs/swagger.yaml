basePath: /api
definitions:
  auth.Role:
    enum:
    - ADMIN
    - COLLABORATOR
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleCollaborator
  auth.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      project_ids:
        items:
          type: string
        type: array
      role:
        $ref: '#/definitions/auth.Role'
      updated_at:
        type: string
    type: object
  auth.acceptInvitationRequest:
    properties:
      password:
        type: string
      token:
        type: string
    type: object
  auth.createInvitationRequest:
    properties:
      email:
        type: string
      name:
        type: string
      project_id:
        type: string
    type: object
  auth.invitationDetailsResponse:
    properties:
      email:
        type: string
      expires_at:
        type: string
      name:
        type: string
    type: object
  auth.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  compiler.Result:
    properties:
      log:
        type: string
      pdfAvailable:
        type: boolean
      success:
        type: boolean
    type: object
  project.CreateProjectRequest:
    properties:
      bibliography:
        type: string
      engine:
        type: string
      mainFile:
        type: string
      name:
        type: string
    type: object
  project.Project:
    properties:
      bibliography:
        type: string
      createdAt:
        type: string
      engine:
        type: string
      id:
        type: string
      mainFile:
        type: string
      memberships:
        items:
          $ref: '#/definitions/project.ProjectMembership'
        type: array
      name:
        type: string
      ownerId:
        type: string
      updatedAt:
        type: string
    type: object
  project.ProjectMembership:
    properties:
      createdAt:
        type: string
      id:
        type: string
      permission:
        type: string
      projectId:
        type: string
      userId:
        type: string
    type: object
info:
  contact: {}
  description: Returns the current API server health status.
  title: EnderTex API
  version: "1.0"
paths:
  /admin/invitations:
    post:
      consumes:
      - application/json
      description: Creates a collaborator invitation and returns the invitation token.
      parameters:
      - description: Invitation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.createInvitationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created invitation
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request or invitation
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
      summary: Create invitation
      tags:
      - Administration
  /auth/accept-invitation:
    post:
      consumes:
      - application/json
      description: Accepts a valid invitation token and creates the associated user
        account.
      parameters:
      - description: Invitation acceptance details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.acceptInvitationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.User'
        "400":
          description: Invalid invitation or request
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
      summary: Accept invitation
      tags:
      - Authentication
  /auth/invitation:
    get:
      consumes:
      - application/json
      description: Returns the details of a valid invitation token.
      parameters:
      - description: Invitation token
        in: query
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.invitationDetailsResponse'
        "400":
          description: Invalid invitation or request
          schema:
            type: string
        "404":
          description: Invitation not found
          schema:
            type: string
        "410":
          description: Invitation has expired
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      summary: Get invitation details
      tags:
      - Authentication
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user using email and password.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.User'
        "400":
          description: Bad Request
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Login
      tags:
      - Authentication
  /auth/logout:
    post:
      description: Invalidates the current session and clears the session cookie.
      responses:
        "204":
          description: No Content
        "405":
          description: Method not allowed
          schema:
            type: string
      summary: Logout
      tags:
      - Authentication
  /auth/me:
    get:
      description: Returns the user associated with the current session.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.User'
        "401":
          description: Unauthorized
          schema:
            type: string
        "405":
          description: Method not allowed
          schema:
            type: string
      security:
      - SessionCookie: []
      summary: Get current user
      tags:
      - Authentication
  /health:
    get:
      description: Returns the current API server health status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - System
  /projects:
    get:
      description: Returns projects available to the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/project.Project'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: List projects
      tags:
      - Projects
    post:
      consumes:
      - application/json
      description: Creates a new LaTeX project and assigns the authenticated user
        as its owner.
      parameters:
      - description: Project configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/project.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/project.Project'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
      summary: Create project
      tags:
      - Projects
  /projects/{projectId}:
    get:
      description: Returns project metadata and membership information for a project.
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/project.Project'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get project
      tags:
      - Projects
  /projects/{projectId}/compile:
    post:
      description: Compiles the project's main LaTeX document using the configured
        LaTeX engine.
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/compiler.Result'
        "400":
          description: Invalid project path
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Compilation or server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Compile project
      tags:
      - Compilation
  /projects/{projectId}/files:
    get:
      description: Returns the files and directories contained in a project.
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid project path
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List project files
      tags:
      - Files
  /projects/{projectId}/files/{filePath}:
    delete:
      description: Provides read, create, update, rename, and delete operations for
        project files.
      parameters:
      - description: Project ID
        in: path
        name: projectId
        required: true
        type: string
      - description: Project-relative file path
        in: path
        name: filePath
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "204":
          description: No Content
        "400":
          description: Invalid file path or request
          schema:
            type: string
